<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Geryon Recon</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
    <div class="brand">
        <a class="brand-back" href="/" title="В главное меню">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="16" height="16">
                <path d="M3 11l9-8 9 8"/>
                <path d="M5 10v10h5v-6h4v6h5V10"/>
            </svg>
        </a>
        <span class="brand-icon">🛡</span>
        <span class="brand-name">Geryon <span class="brand-sub">Recon</span></span>
    </div>
    <div class="topbar-meta">
        <span class="dot"></span>
        <span id="server-status">local · 127.0.0.1:5555</span>
    </div>
</header>

<main class="container">

    <section class="panel new-task-panel">
        <h2 class="panel-title">
            <svg class="pt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"/>
                <line x1="12" y1="8" x2="12" y2="16"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            Новая задача
        </h2>
        <div class="new-task">
            <select id="task-type">
                <option value="email">email</option>
                <option value="email_reg">email_reg (где зарегистрирован)</option>
                <option value="domain">domain</option>
                <option value="username">username</option>
                <option value="ip">ip</option>
                <option value="phone">phone</option>
                <option value="person">person (ФИО)</option>
                <option value="telegram">telegram (@username)</option>
                <option value="geo">geo (координаты / адрес)</option>
                <option value="exif">exif (путь к фото / URL)</option>
            </select>
            <input id="task-target" type="text"
                   placeholder="email / домен / ник / IP / телефон / ФИО / @telegram / координаты / путь к фото">
            <button id="task-add">Поставить задачу</button>
        </div>
    </section>

    <div class="grid">
        <section class="panel col-bots">
            <h2 class="panel-title">
                <svg class="pt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/>
                    <ellipse cx="12" cy="12" rx="9" ry="3.6"/>
                    <ellipse cx="12" cy="12" rx="3.6" ry="9"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                </svg>
                Агенты <span class="counter" id="bots-count">0</span>
            </h2>
            <div id="bots"></div>
        </section>

        <section class="panel col-tasks">
            <h2 class="panel-title">
                <svg class="pt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="5" y="4" width="14" height="16" rx="2"/>
                    <line x1="9" y1="9" x2="15" y2="9"/>
                    <line x1="9" y1="13" x2="15" y2="13"/>
                    <line x1="9" y1="17" x2="13" y2="17"/>
                </svg>
                Задачи <span class="counter" id="tasks-count">0</span>
            </h2>

            <div class="task-filter" id="task-filter">
                <button class="tf-btn active" data-filter="all">Все</button>
                <button class="tf-btn" data-filter="pending">Pending</button>
                <button class="tf-btn" data-filter="running">Running</button>
                <button class="tf-btn" data-filter="done">Done</button>
                <button class="tf-btn" data-filter="failed">Failed</button>
            </div>

            <div id="tasks"></div>
        </section>
    </div>

</main>

<script type="module" src="/static/panel.js"></script>
</body>
</html>
