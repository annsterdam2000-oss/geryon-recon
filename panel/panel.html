<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>OSINT Panel</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>🕵️ OSINT Panel</h1>

    <section class="new-task">
        <h2>Новая задача</h2>
        <select id="task-type">
            <option value="email">email</option>
            <option value="email_reg">email_reg (где зарегистрирован)</option>
            <option value="domain">domain</option>
            <option value="username">username</option>
            <option value="ip">ip</option>
            <option value="phone">phone</option>
            <option value="person">person (ФИО)</option>
            <option value="telegram">telegram (@username)</option>
            <option value="geo">geo (координаты / адрес)</option>
        </select>
        <input id="task-target" type="text" placeholder="email / домен / ник / IP / телефон / ФИО / @telegram / координаты или адрес">
        <button id="task-add">Поставить задачу</button>
    </section>

    <section>
        <h2>Агенты</h2>
        <div id="bots"></div>
    </section>

    <section>
        <h2>Задачи</h2>
        <div id="tasks"></div>
    </section>

    <script type="module" src="/static/panel.js"></script>
</body>
</html>
